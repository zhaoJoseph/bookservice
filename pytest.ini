[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Playwright's browser session and this project's asyncio_mode=auto don't
# share a process cleanly (see tests/e2e/browser_tests/test_registration_ui_e2e.py's
# docstring) - excluded from default recursion so `pytest`/`pytest tests/`
# stays green; run these explicitly with `pytest tests/e2e/browser_tests/`.
norecursedirs = tests/e2e/browser_tests .venv .git
