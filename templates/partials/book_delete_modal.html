<div class="modal-header">
  <h5 class="modal-title">Edit Book</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <p>Are you sure you want to delete this book?</p>
    <p class="text-muted">Title: {{ book.title }}</p>
    <p class="text-muted">Author: {{ book.author }}</p>
    <p class="text-muted">ISBN: {{ book.isbn }}</p>
    <div class="alert alert-danger" role="alert">
        <strong>Warning!</strong> This action cannot be undone.
    </div>
    <div class="error-message d-none">

    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="button" class="btn btn-danger" hx-delete="/api/v1/books/admin/{{ book.id }}"
        hx-on::after-request="
        if(event.detail.successful) {
            bootstrap.Modal.getInstance(document.getElementById('deleteBookModal')).hide();
        } else {
            const err = document.getElementById('delete-error');
            err.textContent = event.detail.xhr.responseText || 'Failed to delete book. Please try again.';
            err.classList.remove('d-none');
        }
    ">
    Delete
    </button>
</div>
