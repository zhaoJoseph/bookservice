<div class="modal-header">
  <h5 class="modal-title">Search Loan</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-get="/api/v1/loans"
      hx-target="#loan-list"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('searchLoanModal')).hide()"
      >
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" placeholder="email1,email2,email3">
    </div>
    <div class="mb-3">
      <label class="form-label">Id</label>
      <input type="text" class="form-control" name="id" placeholder="id1,id2,id3">
    </div>
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" name="title" placeholder="title1,title2,title3">
    </div>
    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" class="form-control" name="author" placeholder="author1,author2,author3">
    </div>
    <div class="mb-3">
      <label class="form-label">ISBN</label>
      <input type="text" class="form-control" name="isbn" placeholder="isbn1,isbn2,isbn3">
    </div>
    <div class="mb-3">
        <label class="form-label">Genre</label>
        <select class="form-select" name="genre">
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non-Fiction</option>
            <option value="mystery">Mystery</option>
            <option value="science">Science</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label" for="status">Active</label>
        <input type="checkbox" name="status" id="status"></inpt>
    </div>
    <div class="mb-3">
        <label class="form-label" for="status">Pending</label>
        <input type="checkbox" name="status" id="status"></inpt>
    </div>
    <div class="mb-3">
        <label class="form-label" for="status">Returned/Rejected</label>
        <input type="checkbox" name="status" id="status"></inpt>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
