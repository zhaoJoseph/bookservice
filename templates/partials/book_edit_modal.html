<div class="modal-header">
  <h5 class="modal-title">Edit Book</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-put="/api/v1/books/admin/{{ book.id }}"
      hx-target="#book-list"
      hx-swap="outerHTML">
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" name="title" value="{{ book.title }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" class="form-control" name="author" value="{{ book.author }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">ISBN</label>
      <input type="text" class="form-control" name="isbn" value="{{ book.isbn }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" required>{{ book.description }}</textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Genre</label>
        <select class="form-select" name="genre" required>
            <option value="fiction" {% if book.genre == "fiction" %}selected{% endif %}>Fiction</option>
            <option value="non-fiction" {% if book.genre == "non-fiction" %}selected{% endif %}>Non-Fiction</option>
            <option value="mystery" {% if book.genre == "mystery" %}selected{% endif %}>Mystery</option>
            <option value="science" {% if book.genre == "science" %}selected{% endif %}>Science</option>
        </select>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
