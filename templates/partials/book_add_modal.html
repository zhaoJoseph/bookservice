<div class="modal-header">
  <h5 class="modal-title">Edit Book</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<form hx-post="/api/v1/books"
      hx-target="#book-list"
      hx-swap="outerHTML"
      hx-on::after-request="if(event.detail.successful) bootstrap.Modal.getInstance(document.getElementById('addBookModal')).hide()"
      >
  <div class="modal-body">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" name="title" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" class="form-control" name="author" required>
    </div>
    <div class="mb-3">
      <label class="form-label">ISBN</label>
      <input type="text" class="form-control" name="isbn" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" required></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Genre</label>
        <select class="form-select" name="genre" required>
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non-Fiction</option>
            <option value="mystery">Mystery</option>
            <option value="science">Science</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Total Copies</label>
        <input type="number" class="form-control" name="total_copies" min="0" max="200" required>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
   <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
