<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Login Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
         integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>

    <body>
        <div id="login-response">
        </div>
        <div class="container mt-5">
            <div class="row justify-content-center">
                    <div class="col-md-6">
                        <form hx-post="/api/v1/auth/token" hx-target="#login-response" hx-swap="outerHTML" class="card p-4">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email:</label>
                                <input type="email" id="username" name="username" required class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password:</label>
                                <div class="input-group">
                                    <input type="password" id="password" name="password" class="form-control" required>
                                    <button class="input-group-text" type="button" id="togglePassword" style="cursor: pointer;">
                                        👁️
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark">Log In</button>
                        </form>
                    <div id="login-response"></div>
                </div>
            </div>
            <div class="row justify-content-center mt-2 text-center">
                    <div class="col-md-6">
                        Not registered? <a href="/register">Register</a>
                    </div>
            </div>
        </div>
    </body>

    <script src="https://unpkg.com/htmx.org"></script>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });
    </script>

    <script>
        document.body.addEventListener('htmx:beforeSwap', function(event) {
            if (event.detail.xhr.status >= 400) {
                let errorMessage = "An error occurred.";
                try {
                    const errorData = JSON.parse(event.detail.xhr.responseText);
                    errorMessage = errorData.detail || errorMessage;
                } catch (e) {}
                const responseDiv = document.getElementById('login-response');
                responseDiv.style.display = 'block';
                responseDiv.innerHTML = `<div class="alert alert-danger d-flex justify-content-between">${errorMessage || "An error occurred."}
                                        <button type="button" id="toggleMessage">
                                            X
                                         </button>
                                        </div>`;
                return;
            }
        });
    </script>

    <script>
        document.body.addEventListener('click', function(event) {
            if (event.target && event.target.id === 'toggleMessage') {
                const responseDiv = document.getElementById('login-response');
                responseDiv.innerHTML = '';
            }
        });
    </script>
</html>
