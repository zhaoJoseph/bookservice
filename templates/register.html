<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Register Form</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div id="login-response"></div>   
        <div class="container mt-5" id="register-form">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <form hx-post="/api/v1/auth/register" hx-target="#login-response" hx-swap="outerHTML" 
                          class="card p-4" hx-ext="validate"  id="form"
                          >
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" id="email" name="email" required 
                            class="form-control" placeholder="JohnDoe123">
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Name:</label>
                            <input type="text" id="name" name="name" pattern="^[A-Za-z0-9]+$" 
                            required minlength="3" class="form-control" 
                            title="Alphanumeric only" 
                            placeholder="john@example.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password:</label>
                            <div class="input-group">
                                <input type="password" id="password" name="password" required 
                                    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                                    title="Password must have 8+ chars, Upper, Lower, Number, and Special char."
                                    class="form-control" placeholder="••••••••">
                                <button class="input-group-text" type="button" id="togglePassword" style="cursor: pointer;">
                                    👁️
                                </button>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Repeat Password:</label>
                            <input type="password" id="confirm_password" 
                            name="confirm_password" required class="form-control" placeholder="••••••••">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Select 5 Favorite Genres:</label>
                            
                            <div style="max-height: 100px; overflow-y: auto; border: 1px solid #dee2e6; padding: 10px; border-radius: 5px;"
                                const checked = document.querySelectorAll('.genre-check:checked');
                                const errorDiv = document.getElementById('genre-error');
                                if (checked.length !== 5) {
                                    this.setCustomValidity('You must select exactly 5 genres.');
                                    errorDiv.style.display = 'block';
                                    errorDiv.innerText = 'Selected: ' + checked.length + '/5';
                                } else {
                                    this.setCustomValidity('');
                                    errorDiv.style.display = 'none';
                                }
                            ">
                                
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="1" id="g1"><label class="form-check-label" for="g1">Action</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="2" id="g2"><label class="form-check-label" for="g2">Adventure</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="3" id="g3"><label class="form-check-label" for="g3">Comedy</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="4" id="g4"><label class="form-check-label" for="g4">Drama</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="5" id="g5"><label class="form-check-label" for="g5">Fantasy</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="6" id="g6"><label class="form-check-label" for="g6">Horror</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="7" id="g7"><label class="form-check-label" for="g7">Romance</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="8" id="g8"><label class="form-check-label" for="g8">Sci-Fi</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="9" id="g9"><label class="form-check-label" for="g9">Thriller</label></div>
                                <div class="form-check"><input class="form-check-input genre-check" type="checkbox" value="10" id="g10"><label class="form-check-label" for="g10">Western</label></div>
                                
                                <div id="genre-error" class="text-danger mt-2" style="display:none;"></div>
                            </div>
                        </div>


                        <button type="submit" class="btn btn-dark">Log In</button>
                    </form>
                </div>
            </div>
            <div class="row justify-content-center mt-3 text-center">
                <div class="col-md-6">
                    Have an account? <a href="/login">Log In</a>
                </div>
            </div>
        </div>

        <!-- Scripts: Versions must match exactly -->
        <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
        <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/validate.js"></script>

        <script>
            function validateGenres(event) {
                const checkboxes = document.querySelectorAll('.genre-check');
                const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
                const errorMsg = document.getElementById('genre-error');

                if (checkedCount !== 5) {
                    event.preventDefault(); 
                    errorMsg.style.display = 'block';
                    return false;
                }
                
                errorMsg.style.display = 'none';
                return true;
            }
        </script>

        <script>
            document.getElementById('togglePassword').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
            });

            document.getElementById('confirm_password').addEventListener('input', function(e) {
                e.target.setCustomValidity('');
            });

            document.getElementById('password').addEventListener('input', function(e) {
                document.getElementById('confirm_password').setCustomValidity('');
            });
 

            document.body.addEventListener('htmx:confirm', function(evt) {
                const pwd = document.getElementById('password');
                const confirm = document.getElementById('confirm_password');
                
                if (pwd.value !== confirm.value) {
                    confirm.setCustomValidity("Passwords do not match");
                    confirm.reportValidity();
                    evt.preventDefault();
                    return;
                } 

                confirm.setCustomValidity('');
            });
        </script>
        <script>
            document.body.addEventListener('htmx:beforeSwap', function(event) {
                if (event.detail.xhr.status >= 400) {
                    let errorMessage = "An error occurred.";
                    try {
                        const errorData = JSON.parse(event.detail.xhr.responseText);
                        errorMessage = errorData.detail || errorMessage;
                    } catch (e) {}
                    const responseDiv = document.getElementById('login-response');
                    responseDiv.innerHTML = `<div class="alert alert-danger">${errorMessage || "An error occurred."}</div>`;
                    return;
                }

                event.detail.shouldSwap = false;
                const responseDiv = document.getElementById('login-response');
                responseDiv.innerHTML = '<div class="alert alert-success">Registration successful! Check your email for a verification link.</div>';
                document.querySelector("form").reset();
            });
        </script>
    </body>
</html>
