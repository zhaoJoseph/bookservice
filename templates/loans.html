<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <script src="https://unpkg.com/htmx.org"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="modal fade" id="searchLoanModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" id="searchLoanModalContent">
        <!-- htmx swaps this in -->
        <div class="modal-body text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>
        </div>
    </div>
    </div>

    <div class="container-fluid mt-5">
        <div class="d-flex align-items-center mb-4">
            <div style="width: 100px;"></div>
            <h1 class="text-center flex-grow-1 mb-0">Your Loans</h1>
            <button class="btn btn-primary" type="button"
                    hx-get="/api/v1/loans/search"
                    hx-target="#searchLoanModalContent"
                    hx-swap="innerHTML"
                    data-bs-toggle="modal"
                    data-bs-target="#searchLoanModal"
                    >
                <i class="bi bi-search me-1"></i>Search
            </button>
        </div>

        <div class="row">
            <!-- Left: loans list -->
            <div class="col-md-6">
                <div id="loan-list"
                     hx-get="/api/v1/loans"
                     hx-trigger="load"
                     hx-swap="outerHTML">
                    <div class="d-flex justify-content-center align-items-center" style="min-height: 300px;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: selected loan detail -->
            <div class="col-md-6">
                <div id="loan-detail"></div>
            </div>
        </div>
    </div>

    <script>
        let currentlyDisplayedLoanId = null;

        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            const trigger = evt.detail.elt;
            if (trigger.hasAttribute('data-loan-id')) {
            const clickedId = trigger.getAttribute('data-loan-id');
            if (clickedId === currentlyDisplayedLoanId) {
                evt.preventDefault(); // cancel this specific request
                return;
            }
            currentlyDisplayedLoanId = clickedId;
            }
        });
    </script>

</body>
</html>
